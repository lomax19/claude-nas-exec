# À inclure dans le server{} HTTPS de ton reverse proxy Nginx.
# exec-api doit être joignable par son nom de conteneur sur un réseau partagé.
location = /exec {
    proxy_pass http://exec-api:5555/exec;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 35s;
}
location = /health {
    proxy_pass http://exec-api:5555/health;
}
