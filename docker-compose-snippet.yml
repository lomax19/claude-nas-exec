# ─────────────────────────────────────────────────────────────
# Bloc à insérer dans un docker-compose.yml existant qui a déjà
# un reverse proxy conteneurisé (Nginx, Caddy, Traefik...).
# Pour un déploiement autonome, utilise docker-compose.yml.
# ─────────────────────────────────────────────────────────────
# Remplace :
#   - MON_RESEAU_INTERNE  → réseau du conteneur reverse proxy (ex: cantal_default)
#   - MON_RESEAU_DEFAULT  → réseau principal du compose        (ex: loulou_default)
#   - /home/user          → ton répertoire home
#
services:
  exec-api:
    build: .
    container_name: exec-api
    restart: unless-stopped
    networks:
      - MON_RESEAU_DEFAULT
      - MON_RESEAU_INTERNE
    volumes:
      - /home/user:/home/user:ro
      - /mnt:/mnt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - EXEC_API_TOKEN=${EXEC_API_TOKEN}

networks:
  MON_RESEAU_DEFAULT:
    external: true
  MON_RESEAU_INTERNE:
    external: true
