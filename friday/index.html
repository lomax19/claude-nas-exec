<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#02060c">
<title>Friday</title>
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02060c; --ink:#d6ecff; --dim:#7592ad; --cyan:#46c3ff; --line:rgba(70,195,255,.20);
  --glass:rgba(10,26,44,.66); --me:rgba(40,140,220,.20); --warn:#ffb347; --err:#ff7676;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 12%, rgba(30,110,190,.16), transparent 60%), var(--bg)}
button{font:500 12px Rajdhani,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  background:rgba(70,195,255,.08);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(70,195,255,.16)}
button:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;gap:10px;flex:none}
.brand{font:600 14px Rajdhani,sans-serif;letter-spacing:.38em;color:var(--cyan);display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 10px #2ecc71;flex:none}
.dot.off{background:#e74c3c;box-shadow:0 0 10px #e74c3c}
.btns{display:flex;gap:8px}
.stage{position:relative;flex:none;height:clamp(190px,32vh,360px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(250px,54vw);pointer-events:none}
.status{font:500 clamp(16px,2.2vw,24px) Rajdhani,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#eef8ff;
  text-shadow:0 0 16px rgba(70,195,255,.7)}
.detail{margin-top:6px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{flex:1;overflow-y:auto;padding:6px 14px 10px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:15px;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--me);border:1px solid rgba(70,195,255,.28);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:none;color:var(--dim);font-size:12.5px;padding:2px 8px;text-align:center}
.msg .meta{font:500 10.5px Rajdhani,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.msg code{background:rgba(70,195,255,.12);padding:1px 5px;border-radius:4px;font-size:13px}
.msg pre{background:rgba(0,0,0,.35);padding:10px;border-radius:8px;overflow:auto;font-size:12.5px;white-space:pre-wrap}
.msg ul{margin:4px 0;padding-left:20px}
.empty{color:var(--dim);text-align:center;font-size:14px;margin-top:14px;line-height:1.6}
.bar{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(70,195,255,.10);
  background:rgba(2,6,12,.85);backdrop-filter:blur(8px)}
.bar .col{flex-direction:row;align-items:flex-end;gap:8px}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
  background:rgba(10,26,44,.7);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;outline:none}
textarea:focus{border-color:rgba(70,195,255,.55)}
.round{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.rec{background:rgba(255,90,90,.25);border-color:rgba(255,120,120,.6);color:#fff}
#send.stop{background:rgba(255,120,120,.15);border-color:rgba(255,120,120,.5)}
#att{position:relative}
#att[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;
  background:var(--cyan);color:#02060c;font:600 11px/18px Inter,sans-serif;letter-spacing:0;text-align:center;padding:0 4px}
#att.up{animation:attpulse 1s ease-in-out infinite}
@keyframes attpulse{50%{background:rgba(70,195,255,.35)}}
body.drag::before{content:'Lâche le fichier ici';position:fixed;inset:12px;border:2px dashed var(--cyan);border-radius:18px;z-index:20;
  display:grid;place-items:center;font:600 18px Rajdhani,sans-serif;letter-spacing:.2em;color:var(--cyan);background:rgba(2,6,12,.75)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(10,26,44,.95);border:1px solid var(--line);
  padding:9px 14px;border-radius:10px;font-size:13px;max-width:90vw;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.panel{position:fixed;inset:0;background:rgba(2,6,12,.88);display:none;align-items:flex-end;justify-content:center;z-index:8}
.panel.on{display:flex}
.sheet{width:min(560px,100%);max-height:86dvh;overflow:auto;background:#06111e;border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font:600 15px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--cyan);margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid rgba(70,195,255,.10)}
.row .txt{flex:1;min-width:0}.row .nm{font-weight:500}.row .ds{font-size:12.5px;color:var(--dim)}
.row.cur .nm{color:var(--cyan)}
.quota{font-size:12.5px;color:var(--dim);margin:6px 4px 10px;line-height:1.5}
.lock{position:fixed;inset:0;background:rgba(2,6,12,.94);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.lock.on{display:flex}
.lock form{width:min(380px,100%);text-align:center}
.lock h2{font:600 16px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--cyan);margin:0 0 14px}
.lock input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(10,26,44,.8);color:var(--ink);font-size:15px;margin-bottom:10px}
.hint{font-size:12px;color:var(--dim);margin-top:8px}
@media (max-width:600px){ .brand{font-size:12px;letter-spacing:.28em} button{font-size:11px;padding:6px 8px} .msg{font-size:14.5px;max-width:92%} #fs{display:none} }
/* mode halo seul : ni conversation ni texte, juste le halo */
#kbd{display:none}
body.halo .chat,body.halo .label{display:none}
body.halo .stage{flex:1;height:auto}
body.halo .bar{border-top:none;background:none;backdrop-filter:none}
body.halo .bar .col{justify-content:center;align-items:center;gap:22px}
body.halo #kbd{display:grid}
body.halo:not(.typing) #input{display:none}
body.halo:not(.typing):not(.hasatt) #send:not(.stop){display:none}
body.halo:not(.typing) #mic{width:76px;height:76px}
body.halo:not(.typing) #mic svg{width:30px;height:30px}
body.halo.typing #kbd{display:none}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot off" id="dot"></span>FRIDAY</div>
  <div class="btns">
    <button id="snd">Voix : oui</button>
    <button id="mode">Texte</button>
    <button id="new">Nouvelle</button>
    <button id="fs">Plein écran</button>
  </div>
</div>
<div class="stage" id="stage">
  <canvas id="halo"></canvas>
  <div class="label"><div class="status" id="status">Connexion…</div><div class="detail" id="detail"></div></div>
</div>
<div class="chat" id="chat"><div class="col" id="list"></div></div>
<div class="bar">
  <div class="col">
    <button class="round" id="kbd" title="Écrire"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <textarea id="input" rows="1" placeholder="Écris ou dicte à Friday…" enterkeyhint="send"></textarea>
    <button class="round" id="att" title="Joindre un fichier"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
    <input type="file" id="file" multiple hidden>
    <button class="round" id="mic" title="Parler"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="round" id="send" title="Envoyer"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="panel" id="panel"><div class="sheet">
  <h3>VOIX <button id="pclose">Fermer</button></h3>
  <div class="row"><div class="txt"><div class="nm">Réponses à voix haute</div><div class="ds">Sur cet appareil</div></div><button id="ptoggle">Oui</button></div>
  <div class="quota" id="quota"></div>
  <div id="plist"></div>
</div></div>
<div class="lock" id="lock"><form id="lockf">
  <h2>FRIDAY</h2>
  <input id="keyin" type="password" autocomplete="current-password" placeholder="Clé d'accès">
  <button type="submit">Entrer</button>
  <div class="hint">La clé est mémorisée sur cet appareil.</div>
</form></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

// ------------------------------------------------------------- clé d'accès
let KEY = store.get('jarvis.key', '');
const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
if (m) { KEY = m[1]; store.set('jarvis.key', KEY); history.replaceState(null, '', location.pathname); }
function askKey() { $('lock').classList.add('on'); setTimeout(() => $('keyin').focus(), 50); }
$('lockf').onsubmit = e => { e.preventDefault(); KEY = $('keyin').value.trim(); store.set('jarvis.key', KEY); $('lock').classList.remove('on'); start(); };
async function api(path, opts = {}) {
  // 03/11/2026 : delai maximum (30 s par defaut, 0 = aucun) : la page ne reste jamais figee si le reseau decroche
  const ms = opts.timeout === undefined ? 30000 : opts.timeout, ac = new AbortController();
  const tid = ms ? setTimeout(() => ac.abort(), ms) : 0;
  try {
    const r = await fetch(path, { ...opts, signal: ac.signal, headers: { 'X-Jarvis-Key': KEY, ...(opts.headers || {}) } });
    if (r.status === 401) { askKey(); throw new Error('clé'); }
    return r;
  } finally { if (tid) clearTimeout(tid); }
}

// ------------------------------------------------------------- halo
const LOOK = {
  idle:      { energy:.28, speed:.80, bright:.70, spin:.30, hue:203, label:'En veille' },
  listening: { energy:.34, speed:.9,  bright:1.1, spin:0,   hue:140, label:'Je t\'écoute' },  // 28/10 : vert net quand Friday t'ecoute
  thinking:  { energy:.42, speed:1.25, bright:.90, spin:.60, hue:200, label:'Je réfléchis' },
  working:   { energy:.55, speed:1.75, bright:.95, spin:1,   hue:198, label:'Je travaille' },
  done:      { energy:.26, speed:.6,  bright:1,   spin:0,   hue:196, label:'Réponse prête' },
  speaking:  { energy:.18, speed:.7,  bright:.9,  spin:0,   hue:196, label:'Je parle' },
  attention: { energy:.30, speed:.8,  bright:.9,  spin:.3,  hue:32,  label:'Il faut ton avis' },
  offline:   { energy:.04, speed:.15, bright:.18, spin:0,   hue:210, label:'Connexion perdue' },
};
let mode = 'offline';
const P = { ...LOOK.offline };
let level = 0, pulse = 0;
const cv = $('halo'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = $('stage').getBoundingClientRect();
  W = cv.width = Math.floor(r.width * dpr); H = cv.height = Math.floor(r.height * dpr);
}
addEventListener('resize', resize); resize();
let t = 0, prev = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  const tgt = LOOK[mode] || LOOK.idle, k = 1 - Math.pow(.02, dt);
  for (const key of ['energy','speed','bright','spin','hue']) P[key] += (tgt[key] - P[key]) * k;
  t += dt * P.speed; pulse *= Math.pow(.15, dt);
  const amp = inputLevel();
  level += (amp - level) * (amp > level ? .5 : .12);
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .30;
  const breath = 1 + .12 * Math.sin(now / 1000 * 1.3);
  const hue = P.hue, br = Math.min(1.2, (P.bright + pulse * .5 + level * .5) * breath);
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 2.2);
  g.addColorStop(0, `hsla(${hue},100%,60%,${.12 * br + level * .2})`);
  g.addColorStop(.5, `hsla(${hue},100%,45%,${.05 * br})`);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let r = 0; r < 6; r++) {
    const ph = r * 1.7; ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const a = i / 200 * Math.PI * 2;
      const w1 = Math.sin(3 * a + t * 1.3 + ph) * .5 + Math.sin(5 * a - t * .9 + ph * 2) * .3 + Math.sin(7 * a + t * 2.1 + ph) * .2;
      const w2 = Math.sin(4 * a + t * 5 + ph) * .6 + Math.sin(9 * a - t * 7 + ph) * .4;
      const rr = R * (1 + r * .018) + R * P.energy * .14 * w1 + R * level * .22 * w2 + R * pulse * .06;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue + r * 3},100%,${62 - r * 4}%,${Math.max(.05, (.55 - r * .06) * br)})`;
    ctx.lineWidth = (r ? 1.3 : 2.3) * dpr;
    ctx.shadowColor = `hsla(${hue},100%,60%,${.9 * br})`; ctx.shadowBlur = (r ? 10 : 24) * dpr * br;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  const tickR = R * 1.42, rot = t * .05;
  ctx.strokeStyle = `hsla(${hue},100%,65%,${.22 * br})`; ctx.lineWidth = dpr; ctx.beginPath();
  for (let i = 0; i < 100; i++) {
    const a = i / 100 * Math.PI * 2 + rot, len = (i % 10 ? 3 : 8) * dpr;
    ctx.moveTo(cx + Math.cos(a) * tickR, cy + Math.sin(a) * tickR);
    ctx.lineTo(cx + Math.cos(a) * (tickR + len), cy + Math.sin(a) * (tickR + len));
  }
  ctx.stroke();
  if (P.spin > .02) {
    ctx.lineWidth = 2 * dpr; ctx.shadowColor = `hsla(${hue},100%,60%,.9)`; ctx.shadowBlur = 12 * dpr;
    for (let j = 0; j < 3; j++) {
      const a0 = t * 1.4 * (j % 2 ? -1 : 1) + j * 2.1;
      ctx.strokeStyle = `hsla(${hue},100%,70%,${.55 * P.spin})`;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.24 + j * 5 * dpr, a0, a0 + .7 + j * .2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function setMode(m2, detail) {
  if (m2 === 'listening' && mode !== 'listening') pulse = 1.8;  // flash : Friday t'a entendu
  mode = m2; $('status').textContent = (LOOK[m2] || LOOK.idle).label;
  if (detail !== undefined) $('detail').textContent = detail || '';
}

// ------------------------------------------------------------- son
let soundOn = store.get('jarvis.sound', '1') === '1';
let actx = null, analyser = null, abuf = null, playing = null, micAnalyser = null;
let curGen = -1, clips = [], ended = true, idleTimer = null;
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
    analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.connect(actx.destination);
    abuf = new Float32Array(analyser.fftSize);
  }
  if (actx.state === 'suspended') actx.resume();
}
document.addEventListener('pointerdown', () => { if (soundOn) ensureAudio(); }, true);
function inputLevel() {
  const a = micAnalyser || (playing ? analyser : null);
  if (!a) return 0;
  a.getFloatTimeDomainData(abuf);
  let s = 0; for (let i = 0; i < abuf.length; i++) s += abuf[i] * abuf[i];
  return Math.min(1, Math.sqrt(s / abuf.length) * 4.5);
}
function setSoundBtn() { $('snd').textContent = 'Voix'; $('ptoggle').textContent = soundOn ? 'Oui' : 'Non'; }
$('ptoggle').onclick = () => { soundOn = !soundOn; store.set('jarvis.sound', soundOn ? '1' : '0'); setSoundBtn(); if (soundOn) ensureAudio(); else stopAudio(); };
let preview = null;
function stopPreview() { if (preview) { preview.pause(); preview = null; } }
$('pclose').onclick = () => { stopPreview(); $('panel').classList.remove('on'); };
$('panel').onclick = e => { if (e.target.id === 'panel') $('pclose').onclick(); };
$('snd').onclick = openVoices;
async function openVoices() {
  $('panel').classList.add('on'); $('plist').innerHTML = '<div class="quota">Chargement…</div>'; $('quota').textContent = '';
  let j;
  try { j = await (await api('/api/voices')).json(); } catch (e) { $('plist').innerHTML = '<div class="quota">NAS injoignable</div>'; return; }
  const q = j.quota;
  if (q && q.limit) {
    const reste = Math.max(0, q.limit - q.used);
    let r = ''; if (q.reset) { const d = new Date(q.reset * 1000); r = ' · remis à zéro le ' + d.getDate() + '/' + (d.getMonth() + 1); }
    $('quota').textContent = 'ElevenLabs : ' + reste.toLocaleString('fr-FR') + ' caractères restants sur ' + q.limit.toLocaleString('fr-FR') + r + '. Quand il n\'en reste plus, Jarvis repasse tout seul sur Piper.';
  }
  const cur = j.current || {};
  const items = [{ voice_id: 'piper', name: 'Piper', desc: 'Voix installée sur le NAS, gratuite et illimitée' }].concat(j.choices || []);
  $('plist').innerHTML = '';
  for (const v of items) {
    const isCur = (v.voice_id === 'piper' && cur.engine !== 'elevenlabs') || (cur.engine === 'elevenlabs' && cur.name === v.name);
    const row = document.createElement('div'); row.className = 'row' + (isCur ? ' cur' : '');
    row.innerHTML = '<div class="txt"><div class="nm"></div><div class="ds"></div></div>';
    row.querySelector('.nm').textContent = v.name + (isCur ? ' ✓' : '');
    row.querySelector('.ds').textContent = v.desc || '';
    if (v.voice_id !== 'piper') {
      const b = document.createElement('button'); b.textContent = 'Écouter';
      b.onclick = () => {
        stopPreview(); preview = new Audio('/api/preview/' + v.voice_id + '?k=' + encodeURIComponent(KEY));
        b.textContent = '…'; preview.onplaying = () => b.textContent = 'Écouter'; preview.onended = () => b.textContent = 'Écouter';
        preview.play().catch(() => { b.textContent = 'Écouter'; toast('Extrait indisponible'); });
      };
      row.appendChild(b);
    }
    const c = document.createElement('button'); c.textContent = isCur ? 'Actuelle' : 'Choisir'; c.disabled = isCur;
    c.onclick = async () => {
      stopPreview(); if (soundOn) ensureAudio(); c.textContent = '…'; c.disabled = true;
      try {
        const r = await api('/api/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voice_id: v.voice_id }) });
        const jj = await r.json();
        if (!r.ok) { toast(jj.error || 'Refusé', 8000); c.textContent = 'Choisir'; c.disabled = false; return; }
        $('panel').classList.remove('on'); toast('Nouvelle voix : ' + v.name);
      } catch (e) { toast('NAS injoignable'); c.textContent = 'Choisir'; c.disabled = false; }
    };
    row.appendChild(c); $('plist').appendChild(row);
  }
}
setSoundBtn();
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
function stopAudio() { clips = []; ended = true; if (playing) { try { playing.stop(); } catch (e) {} playing = null; } }
async function loadClip(c) {
  try {
    const r = await api(c.url + '?k=' + encodeURIComponent(KEY));
    c.buffer = await actx.decodeAudioData(await r.arrayBuffer());
  } catch (e) { c.failed = true; }

        file16 = []; enreg = { parts: [], parle: false, calme: 0, t0: performance.now(), seuil: Math.max(bruit * 3, 150), max: 6000 };
        setMode('listening', 'Je t\'écoute'); rapport('SUIVI : Friday attend ta reponse'); };
      toast('Dis « Hey Friday »', 2500);
      rapport('ecoute prete, micro ' + (flux.getAudioTracks()[0] || {}).label + ', son ' + ctxA.state + ' ' + ctxA.sampleRate + ' Hz');
      setInterval(() => { rapport('etat: son ' + ctxA.state + ', niveau ' + Math.round(niveaux.length ? niveaux.reduce((a, b) => a + b) / niveaux.length : -1) + ', score max 30 s ' + smax.toFixed(2) + ', pause ' + pause + ', mode ' + mode + ', cache ' + document.hidden); smax = 0; }, 30000);
    } catch (e) { console.error('Hey Friday', e); rapport('ERREUR demarrage : ' + (e.message || e)); toast('« Hey Friday » indisponible : ' + (e.message || e), 6000); }
  }
  demarrer();
})();

start();
})();
